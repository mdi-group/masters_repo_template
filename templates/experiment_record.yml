# Copy this file for each substantial analysis or model run.
experiment_id: "<unique short ID>"
date_started: "YYYY-MM-DD"
purpose: "<question this run addresses>"
hypothesis_or_expectation: "<optional>"
inputs:
  - dataset_id: "<ID from data/manifest.csv>"
    version_or_sha256: "<version or checksum>"
code_commit: "<Git commit hash>"
command: "<exact command used>"
configuration: "<config path or inline settings>"
random_seed: "<integer, not applicable, or unknown>"
environment: "<docs/ENVIRONMENT.md or lock-file path>"
outputs:
  - location: "<path or approved storage URI>"
    sha256: "<checksum if useful>"
outcome: "<complete, partial, failed, or other status>"
notes: "<limitations, deviations, or follow-up>"
